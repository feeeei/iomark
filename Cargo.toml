[package]
name = "iomark"
version = "0.1.0"
edition = "2024"
description = "A CrystalDiskMark-style disk benchmark for the terminal, powered by an embedded fio"
license = "GPL-2.0-only"
repository = "https://github.com/feeeei/iomark"
readme = "README.md"
keywords = ["benchmark", "disk", "fio", "tui", "crystaldiskmark"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.5.2", features = ["termination"] }
humantime = "2.4.0"
parse-size = "1.1.0"
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WNet",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
] }

# Size-optimized: the performance-critical path is fio's C code (compiled at
# -O3 by build.rs), so "z" on the Rust side does not affect measurements.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
